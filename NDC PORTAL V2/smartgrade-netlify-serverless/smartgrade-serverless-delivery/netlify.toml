[build]
  publish = "frontend"
  functions = "netlify/functions"

# Deploy Previews are used as the controlled staging environment for pull
# requests. Force Netlify to build these previews instead of cancelling them
# through automatic content-change detection.
[context.deploy-preview]
  ignore = "exit 1"

# Routes /api/* to the Express app running as a Netlify Function, so the
# frontend and backend share one origin — no CORS configuration needed in
# production.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200


# Always revalidate the application shell and JavaScript so a newly published
# production deploy cannot keep an older Admin renderer in the browser cache.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
