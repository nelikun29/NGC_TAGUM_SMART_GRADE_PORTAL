name: Phase 5 isolated security tests
on:
  push:
    branches:
      - phase5-security-hardening-preview
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NDC PORTAL V2/smartgrade-netlify-serverless/smartgrade-serverless-delivery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --ignore-scripts; fi
      - name: Check authentication code syntax
        run: |
          node --check backend/middleware/auth.js
          node --check backend/routes/auth.js
          node --check backend/routes/assessments.js
      - name: Run isolated session tests
        run: node --test backend/tests/session-security.test.js
